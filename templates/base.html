<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AutoMark{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('home') }}"><span class="mark">✓</span> AutoMark</a>
  <nav>
    <a href="{{ url_for('home') }}">Tests</a>
    <a href="{{ url_for('settings') }}">Settings
      <span class="pill ok">{{ settings.engine_name }}</span></a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
