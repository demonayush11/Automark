{% extends "base.html" %}
{% block body %}
<h1>New test</h1>
<form method="post" enctype="multipart/form-data" class="card narrow">
  <label>Test name <input name="name" value="{{ name or '' }}" placeholder="e.g. Biology Unit Test 2" required></label>
  <label>Marking scheme file <span class="muted">(typed PDF, Word or TXT)</span>
    <input type="file" name="scheme_file" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.webp">
  </label>
  <div class="or">or paste it</div>
  <textarea name="scheme_text" rows="10" placeholder="Q1 [3] Define photosynthesis.
- plants make their own food (1)
- using sunlight (1)
- from carbon dioxide and water (1)
Q2 [2] ...">{{ scheme_text or '' }}</textarea>
  <p class="hint">Use the format shown above: <code>Q&lt;no&gt; [max marks]</code>, then one marking point per line with its marks in brackets. You can correct it on the next page.</p>
  <button class="btn primary">Read scheme →</button>
</form>
{% endblock %}
