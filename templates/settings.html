{% extends "base.html" %}
{% block body %}
<h1>Settings</h1>
<form method="post" class="card narrow">
  <fieldset>
    <legend>Reading handwriting</legend>
    <label class="radio"><input type="radio" name="reader" value="auto" {{ 'checked' if settings.reader == 'auto' }}> Own model, TrOCR if unsure (recommended) — a page where over 25% of words are unsure is read again by TrOCR</label>
    <label class="radio"><input type="radio" name="reader" value="own" {{ 'checked' if settings.reader == 'own' }}> Own model only (CNN + LSTM + CTC)</label>
    <label class="radio"><input type="radio" name="reader" value="trocr" {{ 'checked' if settings.reader == 'trocr' }}> TrOCR only (<code>{{ trocr_model }}</code>)</label>
  </fieldset>
  <fieldset>
    <legend>Marking</legend>
    <label class="radio"><input type="radio" name="engine" value="similarity" {{ 'checked' if settings.engine == 'similarity' }}> Sentence-BERT — compares meaning, so different wording still gets marks (<code>{{ sbert_model }}</code>)</label>
    <label class="radio"><input type="radio" name="engine" value="keywords" {{ 'checked' if settings.engine == 'keywords' }}> Keywords — checks that the key words of each point appear</label>
  </fieldset>
  <p class="hint">All models run on this computer. No API is called and no data leaves the computer. TrOCR (about 1.3 GB) and Sentence-BERT (about 90 MB) are downloaded once, the first time they are used.</p>
  <button class="btn primary">Save</button>
</form>
{% endblock %}
